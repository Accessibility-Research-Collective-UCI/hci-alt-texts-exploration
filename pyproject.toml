[project]
name = "hci-alt-texts-exploration"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.34",
    "bs4>=0.0.2",
    "lxml>=6.1.1",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "tqdm>=4.68.3",
    "transformers==4.57.1",
    "torch",
    "torchaudio",
    "torchvision",
    "accelerate>=1.11.0",
    "url-normalize>=3.0.0",
    "ftfy>=6.3.1",
    "wordninja>=2.0.0",
]

[tool.uv]
package = false
required-environments = [
  "sys_platform == 'win_amd64' or sys_platform == 'linux'"
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win_amd64'"},
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win_amd64'"},
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' and sys_platform != 'win_amd64'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win_amd64'" },
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.8",
    "pre-commit>=4.6.0",
]
notebooks = [
    "jupyterlab>=4.6.0",
]
